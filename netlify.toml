[build]
command = "npm run inject-graphics && turbo run build && node scripts/generate-indexnow-manifest.ts"
publish = "apps/web/build/client"
image = "ubuntu-24.04"

# build envs
[build.environment]
NODE_VERSION = "24.12.0"

# branch-deploy
[context.branch-deploy]
command = "npm run inject-graphics && turbo run build:dev"

# deploy-preview
[context.deploy-preview]
command = "npm run inject-graphics && turbo run build:dev"

[[edge_functions]]
path = "/api/discord-members"
function = "discord-members"

[[edge_functions]]
path = "/api/github/repository"
function = "github"
cache = "manual"

[[edge_functions]]
path = "/api/github/contributors"
function = "github"
cache = "manual"
