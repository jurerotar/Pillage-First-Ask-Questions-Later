name: Deploy bug reporter

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: true
        default: master
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-bug-reporter
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.10.0
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --include=optional

      - name: Create release artifact
        run: |
          set -euo pipefail
          release_id="${GITHUB_SHA}"
          package_directory=".deploy/bug-reporter"
          mkdir -p "$package_directory/apps/bug-reporter"
          cp package.json package-lock.json "$package_directory/"
          cp apps/bug-reporter/package.json "$package_directory/apps/bug-reporter/"
          cp -R apps/bug-reporter/src "$package_directory/apps/bug-reporter/"
          tar --create --gzip --file="bug-reporter-${release_id}.tar.gz" -C "$package_directory" .
          sha256sum "bug-reporter-${release_id}.tar.gz" > "bug-reporter-${release_id}.tar.gz.sha256"

      - name: Configure SSH
        env:
          DEPLOY_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload release artifact
        env:
          DEPLOY_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          DEPLOY_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}
          NPM_COMMAND: /home/pillagefirst/nodevenv/bug-reporter/24/bin/npm
        run: |
          set -euo pipefail
          release_id="${GITHUB_SHA}"
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes "$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH/incoming'"
          scp -P "$DEPLOY_PORT" -o BatchMode=yes "bug-reporter-${release_id}.tar.gz" "bug-reporter-${release_id}.tar.gz.sha256" "$DEPLOY_HOST:$DEPLOY_PATH/incoming/"

      - name: Activate release atomically
        env:
          DEPLOY_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          DEPLOY_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          release_id="${GITHUB_SHA}"
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes "$DEPLOY_HOST" bash -s -- "$DEPLOY_PATH" "$release_id" <<'REMOTE'
          set -euo pipefail
          deploy_path="$1"
          release_id="$2"
          artifact="$deploy_path/incoming/bug-reporter-$release_id.tar.gz"
          checksum="$deploy_path/incoming/bug-reporter-$release_id.tar.gz.sha256"
          releases_path="$deploy_path/releases"
          release_path="$releases_path/$release_id"

          test -d "$deploy_path"
          mkdir -p "$releases_path"
          test ! -e "$release_path"
          (cd "$deploy_path/incoming" && sha256sum --check "$(basename "$checksum")")
          mkdir "$release_path"
          tar --extract --gzip --file="$artifact" --directory="$release_path"
          (
            cd "$release_path"
            "$NPM_COMMAND" ci --omit=dev --ignore-scripts --no-audit --no-fund --engine-strict=false --workspace=@pillage-first/bug-reporter
          )
          mkdir -p "$release_path/tmp"
          ln -s "releases/$release_id" "$deploy_path/current.next"
          mv -Tf "$deploy_path/current.next" "$deploy_path/current"
          mkdir -p "$deploy_path/tmp"
          touch "$deploy_path/tmp/restart.txt"
          rm -f "$artifact" "$checksum"

          mapfile -t old_releases < <(find "$releases_path" -mindepth 1 -maxdepth 1 -type d ! -name "$release_id" -printf '%T@ %p\n' | sort -n | head -n -5 | cut -d' ' -f2-)
          if ((${#old_releases[@]})); then
            rm -rf -- "${old_releases[@]}"
          fi
          REMOTE
