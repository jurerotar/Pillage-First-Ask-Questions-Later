name: ci

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  TURBO_CACHE_DIR: .turbo

jobs:
  type-check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup environment (node + install)
        uses: $/.github/actions/node-setup

      - name: Generate API route types
        run: npm run generate-api-route-types

      - name: Run type check
        run: npx turbo run type-check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup environment (node + install)
        uses: $/.github/actions/node-setup

      - name: Generate API route types
        run: npm run generate-api-route-types

      - name: Run lint check
        run: npx turbo run lint:check

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup environment (node + install)
        uses: $/.github/actions/node-setup

      - name: Generate API route types
        run: npm run generate-api-route-types

      - name: Run format check
        run: npx turbo run format:check

  localization:
    name: Localization
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup environment (node + install)
        uses: $/.github/actions/node-setup

      - name: Generate API route types
        run: npm run generate-api-route-types

      - name: Run @pillage-first/web localization check
        run: npx --workspace="@pillage-first/web" i18next-cli extract --ci --dry-run

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup environment (node + install)
        uses: $/.github/actions/node-setup

      - name: Generate API route types
        run: npm run generate-api-route-types

      - name: Run tests
        run: npx turbo run test

  zizmor:
    name: Zizmor GitHub Actions check
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
