name: ci

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  TURBO_CACHE_DIR: .turbo

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Type check
            task: type-check
          - name: Lint
            task: lint:check
          - name: Format
            task: format:check
          - name: Localization
            task: localization
          - name: Tests
            task: test
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup environment (node + install)
        uses: ./.github/actions/node-setup

      - name: Generate API route types
        run: npm run generate-api-route-types

      - name: Run ${{ matrix.name }}
        if: matrix.task != 'test' && matrix.task != 'localization'
        env:
          TURBO_TASK: ${{ matrix.task }}
        run: npx turbo run "$TURBO_TASK"

      - name: Run @pillage-first/web localization check
        if: matrix.task == 'localization'
        run: npx --workspace="@pillage-first/web" i18next-cli extract --ci --dry-run

      - name: Run tests
        if: matrix.task == 'test'
        id: run-tests
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" == "pull_request" ]; then
            # Check if package.json or schemas changed
            CHANGED_FILES=$(git diff --name-only "$BASE_SHA" HEAD)
            FORCE_ALL=false
            if echo "$CHANGED_FILES" | grep -q "package.json" || echo "$CHANGED_FILES" | grep -q "^packages/db/src/schemas/"; then
              FORCE_ALL=true
            fi

            if [ "$FORCE_ALL" = true ]; then
              echo "Important files changed, running all tests..."
              npx turbo run test
            else
              npx turbo run test --filter="[$BASE_SHA...HEAD]" -- --changed="$BASE_SHA"
            fi
          else
            npx turbo run test
          fi

  zizmor:
    name: Zizmor GitHub Actions check
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
