# https://github.com/evilmartians/lefthook

output: false
no_tty: true

commit-msg:
  jobs:
    - name: lint
      run: ./node_modules/.bin/commitlint --edit "{1}"

pre-commit:
  parallel: false
  jobs:
    - name: localize
      glob: "apps/web/**/*.{ts,tsx}"
      run: ./node_modules/.bin/turbo run localize --filter=@pillage-first/web && git add "apps/web/app/localization/locales/*/extracted/*.json"
    - name: biome
      stage_fixed: true
      run: ./node_modules/.bin/biome check --write --staged --no-errors-on-unmatched

pre-push:
  jobs:
    - name: biome-ci
      run: ./node_modules/.bin/turbo run format:check lint:check
