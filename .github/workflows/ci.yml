name: ci

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  TURBO_CACHE_DIR: .turbo

jobs:
  type-check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup environment (node + install)
        uses: $/.github/actions/node-setup

      - name: Generate API route types
        run: npm run generate-api-route-types

      - name: Run type check
        run: npx turbo run type-check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup environment (node + install)
        uses: $/.github/actions/node-setup

      - name: Generate API route types
        run: npm run generate-api-route-types

      - name: Run lint check
        run: npx turbo run lint:check

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup environment (node + install)
        uses: $/.github/actions/node-setup

      - name: Generate API route types
        run: npm run generate-api-route-types

      - name: Run format check
        run: npx turbo run format:check

  localization:
    name: Localization
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup environment (node + install)
        uses: $/.github/actions/node-setup

      - name: Generate API route types
        run: npm run generate-api-route-types

      - name: Run @pillage-first/web localization check
        run: npx --workspace="@pillage-first/web" i18next-cli extract --ci --dry-run

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup environment (node + install)
        uses: $/.github/actions/node-setup

      - name: Generate API route types
        run: npm run generate-api-route-types

      - name: Run tests
        id: run-tests
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" == "pull_request" ]; then
            # Check if package.json or schemas changed
            CHANGED_FILES=$(git diff --name-only "$BASE_SHA" HEAD)
            FORCE_ALL=false
            if echo "$CHANGED_FILES" | grep -q "package.json" || echo "$CHANGED_FILES" | grep -q "^packages/db/src/schemas/"; then
              FORCE_ALL=true
            fi

            if [ "$FORCE_ALL" = true ]; then
              echo "Important files changed, running all tests..."
              npx turbo run test
            else
              npx turbo run test --filter="[$BASE_SHA...HEAD]" -- --changed="$BASE_SHA"
            fi
          else
            npx turbo run test
          fi

  zizmor:
    name: Zizmor GitHub Actions check
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
